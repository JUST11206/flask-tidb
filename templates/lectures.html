<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Lectures</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    color:#6c63ff;
    margin-bottom:30px;
}

.lecture-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
iframe{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    display:block;
}
video{
    width:100%;
    border-radius:10px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    text-decoration:none;
    background:#6c63ff;
    color:white;
    padding:10px 15px;
    border-radius:5px;
}
</style>

</head>
<body>

<h2 style="margin-top:40px;color:#6c63ff;">📺 YouTube Lectures</h2>

<div class="lecture-grid">

        <div class="card">
        <h3>HTML & CSS Tutorial</h3>

        <iframe
            src="https://www.youtube.com/embed/zysUIv0-xak"
            title="HTML CSS"
            allowfullscreen>
        </iframe>
    </div>

    <div class="card">
        <h3>Python Full Course</h3>

        <iframe
            src="https://www.youtube.com/embed/kqtD5dpn9C8"
            title="Python Course"
            allowfullscreen>
        </iframe>
    </div>
<div class="card">
    <h3>C Language Course</h3>

    <iframe
        src="https://www.youtube.com/embed/irqbmMNs2Bo"
        title="C Language Course"
        allowfullscreen>
    </iframe>
</div>
<div class="card">

        title="Projects"
        allowfullscreen>
    </iframe>
</div>

{% for lecture in lectures %}

<div class="card">

    <h3>{{ lecture.title }}</h3>

    <iframe
        src="{{ lecture.youtube_url }}"
        allowfullscreen>
    </iframe>

</div>

{% endfor %}
