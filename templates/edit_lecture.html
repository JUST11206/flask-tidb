<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Lecture • StudyHub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --text:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --background:#f8fafc;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:var(--background);
}

.form-container{
    width:100%;
    max-width:480px;

    padding:32px;

    background:white;

    border-radius:18px;

    box-shadow:
    0 10px 35px rgba(15,23,42,.10);
}

.form-icon{
    margin-bottom:10px;

    text-align:center;

    font-size:45px;
}

h2{
    margin-bottom:8px;

    text-align:center;

    color:var(--text);
}

.subtitle{
    margin-bottom:25px;

    text-align:center;

    color:var(--muted);

    font-size:14px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#334155;

    font-size:13px;
    font-weight:bold;
}

input,
select{
    width:100%;

    padding:13px 14px;

    margin-bottom:18px;

    border:1px solid var(--border);

    border-radius:10px;

    background:white;

    color:var(--text);

    font-size:15px;
}

input:focus,
select:focus{
    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 3px rgba(79,70,229,.10);
}

button{
    width:100%;

    padding:14px;

    border:none;
    border-radius:10px;

    background:var(--primary);
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:var(--primary-dark);

    transform:translateY(-2px);
}

.back{
    display:block;

    margin-top:18px;

    text-align:center;

    color:var(--muted);

    font-size:13px;

    text-decoration:none;
}

.back:hover{
    color:var(--primary);
}

@media(max-width:500px){

    .form-container{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<div class="form-container">


    <div class="form-icon">
        ✏️
    </div>


    <h2>
        Edit Lecture
    </h2>


    <p class="subtitle">
        Update YouTube lecture details and learning path
    </p>


    <form method="POST" enctype="multipart/form-data">


       <!-- Lecture Title -->

<label>
    Lecture Title
</label>

<input
type="text"
name="title"
value="{{ lecture.title }}"
required>


<!-- Description -->

<label>
    Description
</label>

<textarea
name="description"
rows="4"
style="
width:100%;
padding:13px;
margin-bottom:18px;
border:1px solid #cbd5e1;
border-radius:10px;
resize:vertical;
">{{ lecture.description }}</textarea>


<!-- Category -->

<label>
    Learning Path
</label>

<select
name="category_id"
required>

{% for category in categories %}

<option
value="{{ category.id }}"
{% if category.id==lecture.category_id %}
selected
{% endif %}
>

{{ category.icon }}
{{ category.name }}

</option>

{% endfor %}

</select>

<label>
    Course
</label>

<select
name="course_id"
required>

    <option value="">
        Select Course
    </option>

    {% for course in courses %}

    <option
    value="{{ course.id }}"

    {% if course.id == lecture.course_id %}
    selected
    {% endif %}>

        {{ course.title }}

    </option>

    {% endfor %}

</select>

<!-- Video Type -->

<label>
    Video Type
</label>

<select
id="videoType"
name="video_type">

<option
value="youtube"
{% if lecture.video_type=="youtube" %}
selected
{% endif %}
>
YouTube
</option>

<option
value="upload"
{% if lecture.video_type=="upload" %}
selected
{% endif %}
>
Upload MP4
</option>

</select>


<!-- Youtube -->

<div
id="youtubeBox">

<label>
YouTube URL
</label>

<input
type="url"
name="youtube_url"
value="{{ lecture.youtube_url or '' }}">

</div>


<!-- Upload -->

<div
id="uploadBox"
{% if lecture.video_type=="youtube" %}
style="display:none;"
{% endif %}
>

<label>
Replace MP4 Video
</label>

<input
type="file"
name="video_file"
accept="video/mp4">

{% if lecture.video_file %}

<p
style="
margin-top:-10px;
margin-bottom:15px;
font-size:13px;
color:#64748b;
">

Current:
{{ lecture.video_file }}

</p>

{% endif %}

</div>


<!-- Thumbnail -->

<label>
Thumbnail
</label>

<input
type="file"
name="thumbnail"
accept="image/*">

{% if lecture.thumbnail %}

<img
src="{{ url_for('static', filename='uploads/thumbnails/' + lecture.thumbnail) }}"
style="
width:140px;
margin-bottom:20px;
border-radius:8px;
display:block;
">

{% endif %}


<label>
Duration
</label>

<input
type="text"
name="duration"
value="{{ lecture.duration or '' }}">


<label>
Price (₹)
</label>

<input
type="number"
name="price"
value="{{ lecture.price }}">


<div
style="
display:flex;
gap:20px;
margin-bottom:20px;
">

<label>

<input
type="checkbox"
name="is_free"
{% if lecture.is_free %}
checked
{% endif %}
>

Free

</label>

<label>

<input
type="checkbox"
name="is_locked"
{% if lecture.is_locked %}
checked
{% endif %}
>

Locked

</label>

</div>


<button type="submit">

💾 Update Lecture

</button>
</form>


    <a
    href="/manage_lectures"
    class="back">

        ← Back to Manage Lectures

    </a>


</div>

<script>

const type=document.getElementById("videoType");

const youtube=document.getElementById("youtubeBox");

const upload=document.getElementById("uploadBox");

function toggleVideo(){

    if(type.value==="youtube"){

        youtube.style.display="block";

        upload.style.display="none";

    }

    else{

        youtube.style.display="none";

        upload.style.display="block";

    }

}

toggleVideo();

type.addEventListener("change",toggleVideo);

</script>
</body>

</html>
