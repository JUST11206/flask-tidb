<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Lecture • StudyHub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --text:#0f172a;
    --muted:#64748b;
    --border:#cbd5e1;
    --background:#f8fafc;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:var(--background);
}

.form-container{
    width:100%;
    max-width:480px;

    padding:32px;

    background:white;

    border-radius:18px;

    box-shadow:
    0 10px 35px rgba(15,23,42,.10);
}

.form-icon{
    margin-bottom:10px;

    text-align:center;

    font-size:45px;
}

h2{
    margin-bottom:8px;

    text-align:center;

    color:var(--text);
}

.subtitle{
    margin-bottom:25px;

    text-align:center;

    color:var(--muted);

    font-size:14px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#334155;

    font-size:13px;
    font-weight:bold;
}

input,
select{
    width:100%;

    padding:13px 14px;

    margin-bottom:18px;

    border:1px solid var(--border);

    border-radius:10px;

    background:white;

    color:var(--text);

    font-size:15px;
}

input:focus,
select:focus{
    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 3px rgba(79,70,229,.10);
}

button{
    width:100%;

    padding:14px;

    border:none;
    border-radius:10px;

    background:var(--primary);
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:var(--primary-dark);

    transform:translateY(-2px);
}

.back{
    display:block;

    margin-top:18px;

    text-align:center;

    color:var(--muted);

    font-size:13px;

    text-decoration:none;
}

.back:hover{
    color:var(--primary);
}

@media(max-width:500px){

    .form-container{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<div class="form-container">


    <div class="form-icon">
        ✏️
    </div>


    <h2>
        Edit Lecture
    </h2>


    <p class="subtitle">
        Update YouTube lecture details and learning path
    </p>


    <form method="POST">


        <!-- LECTURE TITLE -->

        <label>
            Lecture Title
        </label>

        <input
        type="text"
        name="title"
        value="{{ lecture.title }}"
        placeholder="Lecture Title"
        required>



        <!-- LEARNING PATH -->

        <label>
            Learning Path
        </label>

        <select
        name="category_id"
        required>

            <option value="">
                Select Learning Path
            </option>


            {% for category in categories %}

            <option
            value="{{ category.id }}"

            {% if category.id == lecture.category_id %}
            selected
            {% endif %}>

                {{ category.icon }}
                {{ category.name }}

            </option>

            {% endfor %}


        </select>



        <!-- YOUTUBE URL -->

        <label>
            YouTube Video URL
        </label>

        <input
        type="url"
        name="youtube_url"
        value="{{ lecture.youtube_url }}"
        placeholder="https://youtube.com/watch?v=..."
        required>



        <!-- UPDATE BUTTON -->

        <button type="submit">

            💾 Update Lecture

        </button>


    </form>


    <a
    href="/manage_lectures"
    class="back">

        ← Back to Manage Lectures

    </a>


</div>


</body>

</html>
