<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ note.title }} • StudyHub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f6f8fc;
    min-height:100vh;
    padding:30px 18px;
    color:#1f2937;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    background:#ffffff;
    padding:40px;
    border:1px solid #e5e7eb;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.06);
}

/* TOP */

.note-header{
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid #e5e7eb;
}

.subject{
    display:inline-block;
    background:#eef2ff;
    color:#4f46e5;
    font-size:14px;
    font-weight:700;
    padding:8px 14px;
    border-radius:50px;
    margin-bottom:18px;
}

h1{
    font-size:34px;
    line-height:1.3;
    color:#111827;
    margin-bottom:10px;
}

.note-info{
    color:#6b7280;
    font-size:14px;
}

/* CONTENT */

.content{
    color:#374151;
    line-height:1.9;
    font-size:17px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

/* ACTIONS */

.actions{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:35px;
    padding-top:25px;
    border-top:1px solid #e5e7eb;
}

.save-btn,
.back{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
    transition:.25s;
}

.save-btn{
    background:#fff1f2;
    color:#e11d48;
}

.save-btn:hover{
    background:#e11d48;
    color:#ffffff;
    transform:translateY(-2px);
}

.back{
    background:#4f46e5;
    color:#ffffff;
}

.back:hover{
    background:#4338ca;
    transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:600px){

    body{
        padding:0;
        background:#ffffff;
    }

    .container{
        padding:25px 20px;
        border:none;
        border-radius:0;
        box-shadow:none;
        min-height:100vh;
    }

    h1{
        font-size:27px;
    }

    .content{
        font-size:16px;
        line-height:1.8;
    }

    .actions{
        flex-direction:column;
    }

    .save-btn,
    .back{
        width:100%;
        padding:14px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="note-header">

        <div class="subject">
            📖 {{ note.subject }}
        </div>

        <h1>
            {{ note.title }}
        </h1>

        <div class="note-info">
            📚 StudyHub Notes
            {% if note.views is defined %}
                • 👁 {{ note.views }} views
            {% endif %}
        </div>

    </div>

    <div class="content">{{ note.content }}</div>

    <div class="actions">

        <a href="/save_note/{{ note.id }}" class="save-btn">
            ❤️ Save Note
        </a>

        <a href="/notes" class="back">
            ← Back to Notes
        </a>

    </div>

</div>

</body>

</html>
