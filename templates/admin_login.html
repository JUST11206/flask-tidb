<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.login-box{
    background:white;
    width:100%;
    max-width:400px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    color:#6c63ff;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:12px 15px;
    border:2px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#6c63ff;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#6c63ff;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#5548e8;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#6c63ff;
    font-weight:bold;
}

/* Mobile */

@media(max-width:480px){

    .login-box{
        padding:25px;
    }

    .login-box h2{
        font-size:24px;
    }

    input,
    button{
        font-size:14px;
    }
}

</style>

</head>
<body>

<div class="login-box">


<h2>⚙️ Admin Login</h2>

<form method="POST">

    <div class="input-group">
        <input type="text"
               name="username"
               placeholder="Username"
               required>
    </div>

    <div class="input-group">
        <input type="password"
               name="password"
               placeholder="Password"
               required>
    </div>

    <button type="submit">
        Login
    </button>

</form>

<a href="/" class="back-link">
    ← Back to Home
</a>

</div>

</body>
</html>
