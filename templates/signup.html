<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub - Create Account</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#6c63ff;
    font-size:32px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#6c63ff;
}

.signup-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#6c63ff;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
    transition:.3s;
}

.signup-btn:hover{
    background:#564fd8;
}

.link{
    text-align:center;
    margin-top:20px;
}

.link p{
    color:#666;
    margin-bottom:15px;
}

.link a{
    text-decoration:none;
    color:#6c63ff;
    font-weight:bold;
}

.home-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#333;
    color:white !important;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.home-btn:hover{
    background:#111;
}
.loader-container{
    display:none;
    text-align:center;
    margin-top:20px;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #6c63ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
.alert{
    background:#ffebee;
    color:#d32f2f;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
    text-align:center;
}
.guest-btn{
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

.guest-btn button{
    padding:10px 20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
@media (max-width: 600px){
    .guest-btn{
        width: 100%;
        display: flex;
        justify-content: center;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>StudyHub</h1>
        <p>Create Your Account</p>
    </div>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}
    <form method="POST">

        <h2>Signup</h2>

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Create Password"
            required>

        <button type="submit" class="signup-btn">
            Create Account
        </button>

    </form>
    
<div class="guest-btn">
    <a href="/guest_login">
        <button>
            Continue as Guest
        </button>
    </a>
</div>

    <div class="link">

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a href="/" class="home-btn">
             Back to Home
        </a>

    </div>

</div>
</body>
</html>
