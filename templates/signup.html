<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#6c63ff;
    font-size:32px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#6c63ff;
}

.signup-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#6c63ff;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
    transition:.3s;
}

.signup-btn:hover{
    background:#564fd8;
}

.link{
    text-align:center;
    margin-top:20px;
}

.link p{
    color:#666;
    margin-bottom:15px;
}

.link a{
    text-decoration:none;
    color:#6c63ff;
    font-weight:bold;
}

.home-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#333;
    color:white !important;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.home-btn:hover{
    background:#111;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>StudyHub</h1>
        <p>Create Your Account</p>
    </div>

    <form method="POST">

        <h2>Signup</h2>

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Create Password"
            required>

        <button type="submit" class="signup-btn">
            Create Account
        </button>

    </form>

    <div class="link">

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a href="/" class="home-btn">
            🏠 Back to Home
        </a>

    </div>

</div>

</body>
</html>
