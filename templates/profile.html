
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.profile-card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    margin:0 auto 20px;
    background:#6c63ff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:40px;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.file-input{
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    background:#6c63ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}

.dashboard-btn{
    display:block;
    margin-top:15px;
    text-align:center;
    text-decoration:none;
    background:#333;
    color:white;
    padding:12px;
    border-radius:8px;
}

@media(max-width:768px){

    .profile-card{
        padding:20px;
    }

    .avatar{
        width:100px;
        height:100px;
    }
}

</style>
</head>

<body>

<div class="profile-card">

<form method="POST" enctype="multipart/form-data">

    <div class="avatar">

        {% if profile_image %}
            <img src="{{ url_for('static', filename='profile_images/' + profile_image) }}" alt="Profile">
        {% else %}
            {{ username[0]|upper }}
        {% endif %}

    </div>

    <div class="file-input">
        <input
            type="file"
            name="profile_image"
            accept="image/*">
    </div>

    <div class="form-group">
        <label>Username</label>
        <input
            type="text"
            value="{{ username }}"
            readonly>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input
            type="email"
            value="{{ email }}"
            readonly>
    </div>

    <div class="form-group">
        <label>Mobile Number</label>
        <input
            type="text"
            name="mobile"
            value="{{ mobile }}"
            placeholder="Enter Mobile Number">
    </div>

    <button type="submit">
        Save Profile
    </button>

</form>

<a href="/dashboard" class="dashboard-btn">
    Back to Dashboard
</a>

</div>
</body>
</html>
