<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Notes</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

/* container */
.container{
    max-width:900px;
    margin:auto;
}

/* title */
h1{
    color:#6c63ff;
    margin-bottom:25px;
    font-size:clamp(22px,4vw,32px);
}

/* card */
.pdf-card{
    background:white;
    padding:15px 18px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

/* text */
.pdf-card h3{
    font-size:16px;
    color:#333;
}

/* SMALL BUTTON (FIXED SIZE) */
.pdf-btn{
    display:inline-block;
    padding:8px 12px;   /* 👈 reduced size */
    font-size:14px;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-weight:500;
    white-space:nowrap;
    transition:0.2s;
}

/* hover */
.pdf-btn:hover{
    transform:scale(1.05);
}

/* back button */
.btn{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#6c63ff;
    color:white;
    padding:10px 14px;
    border-radius:6px;
    font-size:14px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){

    .pdf-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .pdf-btn{
        width:100%;
        text-align:center;
    }
}
</style>

</head>
