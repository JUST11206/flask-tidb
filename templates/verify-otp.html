<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f6f9;
        }

        .container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            color:#6c63ff;
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            outline:none;
            font-size:16px;
            text-align:center;
            letter-spacing:3px;
            margin-bottom:15px;
        }

        input:focus{
            border-color:#6c63ff;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#6c63ff;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#564fd8;
        }

        .alert{
            background:#ffebee;
            color:#d32f2f;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>StudyHub</h1>

    <p>Enter the OTP sent to your email</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
    type="text"
    name="otp"
    maxlength="6"
    pattern="[0-9]{6}"
    placeholder="Enter 6 Digit OTP"
    required>
        <button type="submit">
            Verify OTP
        </button>

    </form>

</div>

</body>
</html>
