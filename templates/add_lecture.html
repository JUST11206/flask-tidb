<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add YouTube Lecture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:#f4f6f9;
}

.form-container{
    width:100%;
    max-width:480px;

    padding:32px;

    background:white;

    border-radius:18px;

    box-shadow:
    0 10px 35px rgba(15,23,42,.10);
}

.form-icon{
    margin-bottom:10px;

    text-align:center;

    font-size:45px;
}

h2{
    margin-bottom:8px;

    text-align:center;

    color:#0f172a;
}

.subtitle{
    margin-bottom:25px;

    text-align:center;

    color:#64748b;

    font-size:14px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#334155;

    font-size:13px;
    font-weight:bold;
}

input,
select{
    width:100%;

    padding:13px 14px;

    margin-bottom:18px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    background:white;

    font-size:15px;
}

input:focus,
select:focus{
    outline:none;

    border-color:#4f46e5;

    box-shadow:
    0 0 0 3px rgba(79,70,229,.10);
}

button{
    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#4f46e5;

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:#4338ca;

    transform:translateY(-2px);
}

.back{
    display:block;

    margin-top:18px;

    text-align:center;

    color:#64748b;

    font-size:13px;

    text-decoration:none;
}

@media(max-width:500px){

    .form-container{
        padding:25px 20px;
    }

}

</style>

</head>


<body>


<div class="form-container">


    <div class="form-icon">
        🎥
    </div>


    <h2>
        Add YouTube Lecture
    </h2>


    <p class="subtitle">
        Add a tutorial to a StudyHub learning path
    </p>


    <form method="POST" enctype="multipart/form-data">

    <label>
        Lecture Title
    </label>

    <input
    type="text"
    name="title"
    placeholder="Example: HTML Full Course"
    required>


    <label>
        Description
    </label>

    <textarea
    name="description"
    placeholder="Enter lecture description..."
    rows="4"
    style="
        width:100%;
        padding:13px;
        margin-bottom:18px;
        border:1px solid #cbd5e1;
        border-radius:10px;
        resize:vertical;
    "></textarea>

    <label>
    Course
</label>

<select
name="course_id"
required>

    <option value="">
        Select Course
    </option>

    {% for course in courses %}

    <option value="{{ course.id }}">

        {{ course.title }}

    </option>

    {% endfor %}

</select>

    <label>
        Video Type
    </label>

    <select
        id="videoType"
        name="video_type"
    >

        <option value="youtube">
            YouTube
        </option>

        <option value="upload">
            Upload MP4
        </option>

    </select>


    <!-- YouTube -->

    <div id="youtubeBox">

        <label>
            YouTube Video URL
        </label>

        <input
        type="url"
        name="youtube_url"
        placeholder="https://youtube.com/watch?v=...">

    </div>


    <!-- Upload -->

    <div
        id="uploadBox"
        style="display:none;">

        <label>
            Upload MP4 Video
        </label>

        <input
        type="file"
        name="video_file"
        accept="video/mp4">

    </div>


    <label>
        Thumbnail
    </label>

    <input
    type="file"
    name="thumbnail"
    accept="image/*">


    <label>
        Duration
    </label>

    <input
    type="text"
    name="duration"
    placeholder="Example: 25 min">

        <label>

            <input
            type="checkbox"
            name="is_free">

            Free Lecture

        </label>

        <label>

            <input
            type="checkbox"
            name="is_locked">

            Locked Lecture

        </label>



    <button type="submit">

        + Add Lecture

    </button>

</form>

    <a
    href="/manage_lectures"
    class="back">

        ← Back to Manage Lectures

    </a>


</div>

<script>

const videoType = document.getElementById("videoType");

const youtubeBox = document.getElementById("youtubeBox");

const uploadBox = document.getElementById("uploadBox");

videoType.addEventListener("change", function(){

    if(videoType.value === "youtube"){

        youtubeBox.style.display = "block";

        uploadBox.style.display = "none";

    }

    else{

        youtubeBox.style.display = "none";

        uploadBox.style.display = "block";

    }

});

</script>

</body>

</html>
