<!DOCTYPE html>
<html>
<head>
    <title>Add PDF</title>
</head>
<body>

<h2>📄 Upload PDF</h2>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="title"
        placeholder="PDF Title"
        required>

    <br><br>

    <input
        type="file"
        name="pdf"
        accept=".pdf"
        required>

    <br><br>

    <button type="submit">
        Upload PDF
    </button>

</form>

</body>
</html>
