<!DOCTYPE html>
<html>
<head>
    <title>Add PDF</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    margin-bottom:15px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fafafa;
    margin-bottom:20px;
}

input:focus{
    outline:none;
    border-color:#2196F3;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2196F3;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1976D2;
}

@media(max-width:500px){

    .container{
        padding:20px;
    }

    h2{
        font-size:22px;
    }

}

</style>

</head>
<body>

<div class="container">

    <h2> Upload PDF</h2>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="text"
            name="title"
            placeholder="PDF Title"
            required>

        <input
            type="file"
            name="pdf"
            accept=".pdf"
            required>

        <button type="submit">
            Upload PDF
        </button>

    </form>

</div>

</body>
</html>
