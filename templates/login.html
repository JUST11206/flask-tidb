<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> StudyHub • Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.container{
    width:400px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#6c63ff;
    font-size:32px;
}

.logo p{
    color:#777;
    margin-top:5px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#6c63ff;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#6c63ff;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
}

.login-btn:hover{
    background:#564fd8;
}

.links{
    margin-top:20px;
    text-align:center;
}

.links p{
    color:#666;
    margin-bottom:15px;
}

.links a{
    text-decoration:none;
    color:#6c63ff;
    font-weight:bold;
}

.home-btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#333;
    color:white;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
}

.home-btn:hover{
    background:#111;
}
.alert{
    background:#ffebee;
    color:#d32f2f;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;
    font-weight:bold;
}

.error{
    border:1px solid #d32f2f;
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">
        <h1>StudyHub</h1>
        <p>Welcome Back</p>
    </div>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
    <form method="POST">

        <h2>Login</h2>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="links">

        <p>
            Don't have an account?
            <a href="/signup">Signup</a>
        </p>

        <a href="/" class="home-btn">
             Back to Home
        </a>

    </div>

</div>

</body>
</html>
