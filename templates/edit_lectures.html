<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Lecture</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2196F3;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

    <h2>✏ Edit Lecture</h2>

    <form method="POST">

        <input
            type="text"
            name="title"
            value="{{ lecture.title }}"
            required>

        <input
            type="text"
            name="youtube_url"
            value="{{ lecture.youtube_url }}"
            required>

        <button type="submit">
            Update Lecture
        </button>

    </form>

</div>

</body>

</html>
