<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

/* Header */

.header{
    background:#6c63ff;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.header h1{
    font-size:28px;
}

/* Container */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

/* Grid */

.admin-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

/* Cards */

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    margin-bottom:15px;
    color:#333;
}

.card p{
    color:#666;
    margin-bottom:20px;
}

/* Buttons */

.btn{
    display:inline-block;
    text-decoration:none;
    background:#6c63ff;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    transition:0.3s;
}

.btn:hover{
    background:#5548e8;
}

/* Bottom Buttons */

.bottom-buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.logout{
    background:#e53935;
}

.logout:hover{
    background:#c62828;
}

/* Mobile */

@media(max-width:768px){

    .container{
        padding:15px;
    }

    .admin-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:20px;
    }

    .btn{
        width:100%;
        text-align:center;
    }

    .bottom-buttons{
        flex-direction:column;
    }
}

</style>

</head>
<body>

<div class="header">
    <h1> StudyHub Admin Panel</h1>
</div>

<div class="container">


    <div class="admin-grid">

    <div class="card">
        <h3>📚 Add Notes</h3>
        <p>Upload and manage study notes.</p>
        <a href="#" class="btn">Open</a>
    </div>

    <div class="card">
        <h3>📄 Add PDFs</h3>
        <p>Upload PDF files for students.</p>
        <a href="/add_pdf" class="btn">Open</a>
    </div>

    <div class="card">
        <h3>🎥 Add Lectures</h3>
        <p>Add YouTube lectures and videos.</p>
        <a href="/add_lecture" class="btn">Open</a>
    </div>

</div>

<div class="bottom-buttons">
    <a href="/dashboard" class="btn">🏠 Dashboard</a>
    <a href="/admin_logout" class="btn logout">🚪 Logout</a>
</div>


</div>

</body>
</html>
